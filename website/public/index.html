<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCBE-KI – OpenClaw Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e0e6f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1d2e;
      padding: 1rem 2rem;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; color: #7cfc00; }
    header span { font-size: 0.85rem; color: #8892a4; }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ff4444;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.connected { background: #7cfc00; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 1rem;
      padding: 1rem 2rem;
    }

    .card {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 1.25rem;
    }

    .card h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7cfc00;
      margin-bottom: 0.75rem;
    }

    /* Bot state panel */
    #state-panel { grid-column: 1; grid-row: 1; }
    #state-raw {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.78rem;
      background: #0f1117;
      border-radius: 4px;
      padding: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre;
      color: #a8d8a8;
    }

    /* Stat chips */
    .stats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .stat-chip {
      background: #0f1117;
      border: 1px solid #2a2d3e;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }
    .stat-chip strong { color: #7cfc00; }

    /* Control panel */
    #control-panel { grid-column: 2; grid-row: 1 / span 2; }

    .form-group { margin-bottom: 0.75rem; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #8892a4;
      margin-bottom: 0.3rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2a2d3e;
      color: #e0e6f0;
      border-radius: 4px;
      padding: 0.45rem 0.6rem;
      font-size: 0.85rem;
    }

    .coord-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }

    button {
      background: #7cfc00;
      color: #0f1117;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5de000; }
    button.danger { background: #ff4444; color: #fff; }
    button.danger:hover { background: #cc0000; }
    button.secondary { background: #2a2d3e; color: #e0e6f0; }
    button.secondary:hover { background: #3a3d5e; }

    .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }

    /* Log panel */
    #log-panel { grid-column: 1; grid-row: 2; }
    #log {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.78rem;
      background: #0f1117;
      border-radius: 4px;
      padding: 0.75rem;
      height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .log-entry { color: #a8d8a8; }
    .log-entry.info  { color: #7cfc00; }
    .log-entry.warn  { color: #ffa500; }
    .log-entry.error { color: #ff4444; }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
      #control-panel { grid-column: 1; grid-row: 3; }
      #log-panel     { grid-column: 1; grid-row: 4; }
    }
  </style>
</head>
<body>
  <header>
    <div class="status-dot" id="status-dot"></div>
    <h1>MCBE-KI – OpenClaw Agent</h1>
    <span id="status-text">Disconnected</span>
  </header>

  <main>
    <!-- Bot state -->
    <div class="card" id="state-panel">
      <h2>Bot State</h2>
      <pre id="state-raw">Waiting for bot…</pre>
      <div class="stats" id="stat-chips"></div>
    </div>

    <!-- Controls -->
    <div class="card" id="control-panel">
      <h2>Send Instructions</h2>

      <div class="form-group">
        <label for="action-select">Action</label>
        <select id="action-select">
          <option value="say">Say (chat message)</option>
          <option value="go_to">Go to coordinates</option>
          <option value="follow">Follow player</option>
          <option value="mine">Mine block</option>
          <option value="collect">Collect item</option>
          <option value="attack">Attack nearest entity</option>
          <option value="stop">Stop</option>
          <option value="jump">Jump</option>
          <option value="look_at">Look at coordinates</option>
        </select>
      </div>

      <!-- say -->
      <div class="form-group param-group" id="param-message">
        <label>Message</label>
        <input type="text" id="input-message" placeholder="Hello world!" />
      </div>

      <!-- go_to / mine / look_at -->
      <div class="form-group param-group coord-group" id="param-coords" style="display:none">
        <label>Coordinates (X / Y / Z)</label>
        <div class="coord-row">
          <input type="number" id="input-x" placeholder="X" />
          <input type="number" id="input-y" placeholder="Y" />
          <input type="number" id="input-z" placeholder="Z" />
        </div>
      </div>

      <!-- follow -->
      <div class="form-group param-group" id="param-player" style="display:none">
        <label>Player name</label>
        <input type="text" id="input-player" placeholder="Steve" />
      </div>

      <!-- collect -->
      <div class="form-group param-group" id="param-item" style="display:none">
        <label>Item name</label>
        <input type="text" id="input-item" placeholder="diamond" />
      </div>

      <!-- attack -->
      <div class="form-group param-group" id="param-target" style="display:none">
        <label>Target type (optional)</label>
        <input type="text" id="input-target" placeholder="minecraft:zombie" />
      </div>

      <div class="btn-row">
        <button id="btn-send">Send</button>
        <button class="secondary" id="btn-clear-log">Clear log</button>
        <button class="danger" id="btn-stop">Emergency Stop</button>
      </div>

      <!-- Raw JSON input -->
      <div class="form-group" style="margin-top:1rem">
        <label for="raw-json">Raw JSON instruction (advanced)</label>
        <input type="text" id="raw-json" placeholder='{"action":"say","message":"hi"}' />
      </div>
      <button class="secondary" id="btn-send-raw">Send Raw</button>
    </div>

    <!-- Log -->
    <div class="card" id="log-panel">
      <h2>Event Log</h2>
      <div id="log"></div>
    </div>
  </main>

  <script>
    // -------------------------------------------------------------------------
    // Logging
    // -------------------------------------------------------------------------
    const logEl = document.getElementById('log');
    function log(msg, level = '') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${level}`;
      const ts = new Date().toLocaleTimeString();
      entry.textContent = `[${ts}] ${msg}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('btn-clear-log').addEventListener('click', () => {
      logEl.innerHTML = '';
    });

    // -------------------------------------------------------------------------
    // SSE – receive live bot state from server
    // -------------------------------------------------------------------------
    const statusDot  = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const stateRaw   = document.getElementById('state-raw');
    const statChips  = document.getElementById('stat-chips');

    function connectSSE() {
      const es = new EventSource('/connect');

      es.addEventListener('bot_state', (e) => {
        const state = JSON.parse(e.data);
        stateRaw.textContent = JSON.stringify(state, null, 2);
        renderStats(state);
        log(`Bot state updated – health: ${state.health ?? '?'}, pos: ${posStr(state.position)}`, 'info');
      });

      es.addEventListener('action_queued', (e) => {
        const action = JSON.parse(e.data);
        log(`Action queued: ${JSON.stringify(action)}`);
      });

      es.onopen = () => {
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected';
        log('Connected to agent server.', 'info');
      };

      es.onerror = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Reconnecting…';
        log('SSE connection lost, retrying…', 'warn');
      };
    }

    function posStr(pos) {
      if (!pos) return '?';
      return `(${pos.x}, ${pos.y}, ${pos.z})`;
    }

    function renderStats(state) {
      statChips.innerHTML = '';
      const chips = [
        ['Health', state.health ?? '?'],
        ['Position', posStr(state.position)],
        ['Dimension', state.dimension ?? '?'],
      ];
      for (const [label, value] of chips) {
        const chip = document.createElement('div');
        chip.className = 'stat-chip';
        chip.innerHTML = `<strong>${label}:</strong> ${value}`;
        statChips.appendChild(chip);
      }
    }

    connectSSE();

    // -------------------------------------------------------------------------
    // Action parameter visibility
    // -------------------------------------------------------------------------
    const actionSelect = document.getElementById('action-select');
    const paramGroups = {
      say:     ['param-message'],
      go_to:   ['param-coords'],
      follow:  ['param-player'],
      mine:    ['param-coords'],
      collect: ['param-item'],
      attack:  ['param-target'],
      stop:    [],
      jump:    [],
      look_at: ['param-coords'],
    };

    function updateParamVisibility() {
      const action = actionSelect.value;
      const visible = new Set(paramGroups[action] ?? []);
      for (const id of ['param-message', 'param-coords', 'param-player', 'param-item', 'param-target']) {
        document.getElementById(id).style.display = visible.has(id) ? '' : 'none';
      }
    }

    actionSelect.addEventListener('change', updateParamVisibility);
    updateParamVisibility();

    // -------------------------------------------------------------------------
    // Send instruction to server
    // -------------------------------------------------------------------------
    async function sendInstruction(payload) {
      try {
        const res = await fetch('/instruct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        log(`Instruction sent → queued: ${data.queued}`);
      } catch (err) {
        log(`Failed to send instruction: ${err.message}`, 'error');
      }
    }

    document.getElementById('btn-send').addEventListener('click', () => {
      const action = actionSelect.value;
      let payload = { action };

      switch (action) {
        case 'say':
          payload.message = document.getElementById('input-message').value;
          break;
        case 'go_to':
        case 'mine':
        case 'look_at':
          payload.x = parseFloat(document.getElementById('input-x').value) || 0;
          payload.y = parseFloat(document.getElementById('input-y').value) || 64;
          payload.z = parseFloat(document.getElementById('input-z').value) || 0;
          break;
        case 'follow':
          payload.player = document.getElementById('input-player').value;
          break;
        case 'collect':
          payload.item = document.getElementById('input-item').value;
          break;
        case 'attack':
          const t = document.getElementById('input-target').value;
          if (t) payload.targetType = t;
          break;
      }

      sendInstruction(payload);
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
      sendInstruction({ action: 'stop' });
      log('Emergency stop sent!', 'warn');
    });

    document.getElementById('btn-send-raw').addEventListener('click', () => {
      const raw = document.getElementById('raw-json').value.trim();
      if (!raw) return;
      try {
        const payload = JSON.parse(raw);
        sendInstruction(payload);
      } catch (e) {
        log(`Invalid JSON: ${e.message}`, 'error');
      }
    });
  </script>
</body>
</html>
